# Kokoro TTS for Noch's voice, exposed the way SpeechOut expects:
# an OpenAI-compatible speech endpoint at http://127.0.0.1:8880/v1/audio/speech
#
# The image is built here (small, CPU-only); the weights are the Kokoro-82M
# folder, mounted read-only, so nothing is downloaded at run time. That folder
# lives outside the repo: set KOKORO_MODEL_DIR to it in a .env file next to this
# file, for example  KOKORO_MODEL_DIR=C:/Users/you/Desktop/Kokoro-82M
#
#   docker compose up -d --build   build + start
#   docker compose logs -f         follow the server log
#   docker compose down            stop and remove
name: kokoro

services:
  kokoro-tts:
    build:
      context: .
      dockerfile: Dockerfile
    image: noch-kokoro:latest
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    restart: unless-stopped
    volumes:
      - "${KOKORO_MODEL_DIR:?set KOKORO_MODEL_DIR to the Kokoro-82M folder (see the note at the top)}:/models:ro"
    environment:
      - KOKORO_MODEL_DIR=/models
      - KOKORO_THREADS=8
    shm_size: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
